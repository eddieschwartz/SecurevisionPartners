version: 2

# Dependabot.
#
# NOTE ON `github-actions`: it is configured ONLY in repos that pin actions
# directly (workspace, mxalert, SecurevisionPartners). The other repos call the
# shared gate as `uses: eddieschwartz/workspace/.github/workflows/ci.yml@main`,
# which is a BRANCH ref, and Dependabot updates version pins -- not branches. It
# also cannot reach that private repo, and failed every run with
# `git_dependencies_not_reachable`. Two independent reasons it has nothing to do
# there, so it is not configured there. A weekly failing job is noise, and noise
# is how a check gets ignored.
#
# Updates are GROUPED: one PR per ecosystem per week is reviewable, fifteen
# separate PRs are a flood that gets ignored -- the alert-fatigue rule that
# governs mxalert's storm tiers, applied to dependency bumps.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
